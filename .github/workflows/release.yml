name: Release
# Publishes the editor as release v<VERSION> (the VERSION in web/js/app.js) whenever web/ changes on main.
# Raise VERSION to start a new release; otherwise the files of the current one are replaced.
# Copyright (C) 2026 Jon Solberg – GPL v3 or later, see LICENSE.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "var VERSION = '\K[^']+" web/js/app.js)
          TAG="v$V"
          mkdir out
          (cd web && zip -qr ../out/efx-le-editor.zip .)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --latest \
              --title "EFX-LE Editor $V" \
              --notes "Open the editor at https://jonsolberg.github.io/efx-le-loop-swither-editor/. efx-le-editor.zip is the same editor to use offline: unzip it and open index.html in Chrome or Edge."
          fi
